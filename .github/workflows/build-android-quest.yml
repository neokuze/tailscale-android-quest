name: Build Android (Quest)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;23.1.7779620"
          sudo apt-get install -y zip

      - name: Set up signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quest.jks"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "questKeystore=$RUNNER_TEMP/quest.jks"
            echo "questKeystorePW=$KEYSTORE_PASSWORD"
            echo "questKeyAlias=$KEY_ALIAS"
            echo "questKeyPW=$KEYSTORE_PASSWORD"
          } > android/local.properties

      - name: Build APK
        run: |
          make libtailscale version gradle-dependencies
          cd android && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-quest-apk
          path: android/build/outputs/apk/release/*.apk
